name: IBIT Overnight Trading Strategy

on:
  schedule:
    # 9:40 AM EST = 14:40 UTC (sell signals) 
    - cron: '40 14 * * 1-5'
    # 3:50 PM EST = 20:50 UTC (buy signals)
    - cron: '50 20 * * 1-5' 
    # 5:30 PM EST = 22:30 UTC (daily reports)
    - cron: '30 22 * * 1-5'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r live_trading/requirements.txt
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Run trading strategy
      continue-on-error: false
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      run: |
        cd live_trading
        
        # Create directories
        mkdir -p results logs data
        
        # Check what time it is (UTC)
        hour=$(date -u +%H)
        
        echo "🕐 Current UTC time: $(date -u +'%Y-%m-%d %H:%M:%S')"
        
        if [ "$hour" = "22" ]; then
          echo "📧 Sending daily email report..."
          python daily_email_report.py
        else
          echo "🚀 Running trading strategy check..."
          python github_trading.py
        fi
    
    - name: Commit results
      continue-on-error: true
      run: |
        # Configure git with GitHub Actions bot info
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add any new files or changes
        git add live_trading/results/ live_trading/logs/ || true
        
        # Only commit if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "📊 Trading data update - $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git push || echo "Push failed, continuing anyway"
        else
          echo "No changes to commit"
        fi